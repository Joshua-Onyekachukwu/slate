services:
  postgres:
    image: postgres:16
    container_name: videogen-pg
    environment:
      POSTGRES_USER: videogen
      POSTGRES_PASSWORD: videogen
      POSTGRES_DB: videogen
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U videogen"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
