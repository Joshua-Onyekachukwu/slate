services:
  postgres:
    image: postgres:16
    container_name: slate-pg
    environment:
      POSTGRES_USER: slate
      POSTGRES_PASSWORD: slate
      POSTGRES_DB: slate
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U slate"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
