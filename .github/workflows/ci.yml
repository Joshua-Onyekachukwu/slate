name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # checkout@v5 + pnpm/action-setup@v6: GitHub runners now force Node 24,
      # which breaks the Node-20 runtime of the v4 actions.
      - uses: actions/checkout@v5

      # NO `version:` pin — pinning 9.15.0 here while package.json declares
      # "packageManager": "pnpm@9.15.9" made the action fail with
      # "Error: Multiple versions of pnpm specified" (see run 31063527747).
      # The action reads the version from package.json instead.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser (for the e2e package in `pnpm test`)
        run: pnpm --filter e2e exec playwright install --with-deps chromium

      - name: Typecheck
        run: pnpm typecheck

      - name: Tests
        run: pnpm test

      - name: Docs consistency check
        run: pnpm check:docs
